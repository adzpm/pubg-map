version: '3'

silent: true

vars:
  IMAGE: pubg-map
  TAG: latest
  PORT: 8080
  DEV_PORT: 5180

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install npm dependencies
    dir: web
    cmds:
      - npm install

  dev:
    desc: Run Vite dev server with HMR
    deps: [ install ]
    dir: web
    cmds:
      - npm run dev

  build:
    desc: Build production bundle into web/dist/
    deps: [ install ]
    dir: web
    cmds:
      - npm run build

  preview:
    desc: Preview production build locally
    deps: [ build ]
    dir: web
    cmds:
      - npm run preview

  lint:
    desc: Run ESLint over web sources
    deps: [ install ]
    dir: web
    cmds:
      - npm run lint

  format:
    desc: Format web sources with Prettier
    deps: [ install ]
    dir: web
    cmds:
      - npm run format

  test:
    desc: Run unit tests with Vitest
    deps: [ install ]
    dir: web
    cmds:
      - npm run test

  tiles:generate:
    desc: Generate map tiles from assets/maps/*.png into web/public/assets/tiles
    cmds:
      - ./scripts/build-tiles.sh

  tiles:clean:
    desc: Remove generated tiles
    cmds:
      - rm -rf web/public/assets/tiles

  tiles:lint:
    desc: List maps that have source PNG but no generated tiles
    cmds:
      - |
        for src in assets/maps/*.png; do
          [ -f "$src" ] || continue

          base=$(basename "$src" .png)
          id=$(echo "$base" | tr '[:upper:]' '[:lower:]')

          if [ ! -d "web/public/assets/tiles/$id" ]; then
            echo "[WARN] Missing tiles: $id"
          fi
        done

  clean:
    desc: Remove build artefacts, coverage and node_modules
    cmds:
      - rm -rf web/dist web/node_modules web/.vite web/coverage

  docker:build:
    desc: Build Docker image
    cmds:
      - docker build -f docker/Dockerfile -t {{.IMAGE}}:{{.TAG}} .

  docker:run:
    desc: Run Docker image on PORT (default 8080)
    deps: [ docker:build ]
    cmds:
      - docker run --rm -p {{.PORT}}:8080 --name {{.IMAGE}} {{.IMAGE}}:{{.TAG}}

  docker:stop:
    desc: Stop running Docker container
    cmds:
      - docker stop {{.IMAGE}} || true

  docker:up:
    desc: Start service via docker-compose (port from docker/docker-compose.yml)
    cmds:
      - docker compose -f docker/docker-compose.yml up -d --build

  docker:down:
    desc: Stop docker-compose service
    cmds:
      - docker compose -f docker/docker-compose.yml down

  helm:lint:
    desc: Lint Helm chart
    cmds:
      - helm lint helm/pubg-map

  helm:template:
    desc: Render Helm chart templates
    cmds:
      - helm template pubg-map helm/pubg-map

  electron:install:
    desc: Install Electron overlay dependencies
    dir: overlay
    cmds:
      - npm install

  electron:dev:
    desc: Run Electron overlay locally
    deps: [ electron:install ]
    dir: overlay
    cmds:
      - npm start

  electron:build:
    desc: Build Windows installer (NSIS) and portable .exe into overlay/dist
    deps: [ electron:install ]
    dir: overlay
    cmds:
      - npm run build

  electron:clean:
    desc: Remove Electron build artefacts and node_modules
    cmds:
      - rm -rf overlay/dist overlay/node_modules
