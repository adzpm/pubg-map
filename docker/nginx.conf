# Cache policy lives in this map because add_header is NOT inherited into
# locations that declare their own add_header — a single server-wide set of
# add_header directives avoids silently dropping the security headers.
# An empty value means no Cache-Control header is emitted.
map $uri $cache_control {
    default                                                          "";
    ~^/assets/tiles/.+\.webp$                                        "public, max-age=31536000, immutable";
    ~^/assets/tiles/.+/info\.json$                                   "public, max-age=3600";
    ~^/assets/.+\.(?:js|css|woff2|woff)$                             "public, max-age=31536000, immutable";
    ~^/workbox-.+\.js$                                               "public, max-age=31536000, immutable";
    ~^/(?:sw\.js|registerSW\.js|manifest\.webmanifest)$             "no-cache";
    # the home page and the per-map pages (/erangel is served from /erangel/index.html)
    ~/index\.html$                                                   "no-cache";
    ~^/og/.+\.jpg$                                                   "public, max-age=86400";
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;

    # no "always" here: Cache-Control must not be attached to 404s, or a missing
    # tile gets its 404 cached for a year by browsers/CDNs
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # the stock mime.types has no entry for .webmanifest
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ^~ /assets/tiles/ {
        access_log off;
        try_files $uri =404;
    }

    # missing hashed build artifacts must 404, not fall through to index.html
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # redirects stay relative: behind the ingress nginx does not know the public scheme and port
    absolute_redirect off;

    # an address that is not a page answers 404, so search engines do not index typos as copies
    # of the home page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # one address per page: /erangel/ -> /erangel
    # the capture is limited to what a page name can contain: the decoded path goes into the
    # Location header, and "/\evil.com/" would otherwise redirect off the site
    location ~ "^/([a-z0-9-]+)/$" {
        return 301 /$1$is_args$args;
    }

    # and /erangel/index.html -> /erangel, /index.html -> /. Matched on the address as requested:
    # internally every page is served from its index.html, so a location would loop
    if ($request_uri ~ "^/index\.html(?:\?|$)") {
        return 301 /$is_args$args;
    }
    if ($request_uri ~ "^/([a-z0-9-]+)/index\.html(?:\?|$)") {
        return 301 /$1$is_args$args;
    }

    # every page is a prerendered file: / and /<map>/index.html
    location / {
        try_files $uri $uri/index.html =404;
    }
}
