<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Map</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <nav class="navbar navbar-dark bg-dark px-3 py-2 flex-shrink-0">
        <span class="navbar-brand mb-0 h1">
            <i class="bi bi-map-fill me-3"></i>
            <span class="text-light">pubg-map</span>
        </span>
        <div class="d-flex align-items-center gap-3">
            <div class="form-check form-switch text-light mb-0">
                <input class="form-check-input" type="checkbox" role="switch" id="gridSwitch" v-model="gridVisible">
                <label class="form-check-label" for="gridSwitch">Grid</label>
            </div>
            <div class="form-check form-switch text-light mb-0">
                <input class="form-check-input" type="checkbox" role="switch" id="secretsSwitch" v-model="secretsVisible">
                <label class="form-check-label" for="secretsSwitch">Secrets</label>
            </div>
            <div class="dropdown">
            <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                {{ currentMap.name }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
                <li v-for="map in maps" :key="map.id">
                    <a class="dropdown-item"
                       :class="{ active: map.id === currentMap.id }"
                       href="#"
                       @click.prevent="selectMap(map)">
                        {{ map.name }}
                        <small class="text-secondary ms-2">{{ map.cells.x }}×{{ map.cells.y }} km</small>
                    </a>
                </li>
            </ul>
            </div>
        </div>
    </nav>

    <div id="map" class="map-viewport"></div>

    <div class="map-status bg-dark text-light px-3 py-1 d-flex gap-4 align-items-center small flex-shrink-0 font-monospace">
        <template v-if="cursor.visible">
            <span class="d-flex gap-2">
                <span class="text-secondary">Cell:</span>
                <strong>{{ cursor.cell }}</strong>
            </span>
            <span class="d-flex gap-2">
                <span class="text-secondary">X:</span>
                <strong>{{ cursor.px }}</strong>
            </span>
            <span class="d-flex gap-2">
                <span class="text-secondary">Y:</span>
                <strong>{{ cursor.py }}</strong>
            </span>
        </template>
        <span v-else class="text-secondary">...</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.27/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
